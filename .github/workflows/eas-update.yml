name: Publish App with EAS Update

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/eas-update.yml'
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check required secrets
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub Secrets 缺少 EXPO_TOKEN（Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Ordinary JS easing functions in Reanimated animations crash release builds.
      - name: Check animations
        run: npm run check:animations

      # Creates the EAS project on the first run, links it afterwards. The
      # project id is written into app.json inside this CI checkout only.
      - name: Link EAS project
        run: eas init --non-interactive --force --json > "$RUNNER_TEMP/eas-init.json"

      # --platform takes a single value, so "all" it is; app.json's expo.platforms is ["ios", "android"],
      # which keeps the web export (and react-native-web) out of it.
      - name: Publish update
        run: eas update --auto --branch main --platform all --non-interactive --json > "$RUNNER_TEMP/eas-update.json"

      - name: Write links to the run summary
        run: |
          node -e '
            const fs = require("fs");
            const init = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/eas-init.json", "utf8"));
            const updates = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/eas-update.json", "utf8"));
            const group = updates[0].group;
            const page = `https://expo.dev/accounts/${init.owner}/projects/${init.slug}/updates/${group}`;
            const deepLink = `exp://u.expo.dev/${init.projectId}/group/${group}`;
            const lines = [
              "## App 已发布",
              "",
              `- 更新页面（二维码在这里，需要另一块屏幕来扫）：[${page}](${page})`,
              "- 在手机上直接打开：复制下面这行，粘贴到手机浏览器地址栏打开，应该会跳转到 Expo Go：",
              "",
              "```",
              deepLink,
              "```",
              "",
              "如果没有跳转：在 Expo Go 里登录同一个 Expo 账号，在项目列表里找到 agenthub 打开。",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(page);
            console.log(deepLink);
          '
